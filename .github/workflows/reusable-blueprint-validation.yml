name: Reusable Blueprint Validation

# A consuming project calls this to validate the blueprint it installed.
#
#   jobs:
#     blueprint:
#       uses: JorvaCode/software-engineering-blueprint/.github/workflows/reusable-blueprint-validation.yml@main
#
# Pin the branch, and re-pin to a tag once a tag carries this content. Two
# reasons pull against each other here and the honest position is that this
# repository has not resolved them:
#
#   - A tag is the correct thing to pin. This workflow is a quality gate, and a
#     gate that moves under you is not a gate.
#   - The v1.0.0 tag predates the structural floor below. Pinning it gives a
#     consumer the original three-call version, which does not check what this
#     file goes on to describe.
#
# Pointing the example at v1.0.0 anyway would hand the consumer a workflow that
# silently checks less than its own documentation promises, and a consumer has
# no way to tell. A branch that can move is the smaller of those two failures,
# so the example pins the branch and says why.
#
# The validation is NOT shared with this repository's gate. It cannot be:
# scripts/validate-blueprint.sh validates *this* repository and the installers
# deliberately do not copy scripts/ into a consumer, so a consuming repository
# has no such file to run. Sharing it would mean shipping the repository's own
# maintenance gate to every consumer and teaching the installer to copy the
# directory it just excluded. The checks below are therefore written out here,
# scoped to the structural floor a consumer actually needs.
#
# That floor is: the installed directories exist, all fifteen phase documents
# exist, each process phase declares its information items, and an adoption
# manifest records a version. The repository-only checks — ADRs, governance,
# VERSION, this repository's adapter — are out of scope for a consumer, and so
# are the reference-link checks, which are about this repository's own prose.
#
# Keeping this list honest is a real obligation: it is a second implementation
# and it will drift. What is enforced is only that this workflow never invokes
# the repository gate, which would fail for every consumer. The prose that
# describes it is reviewed, not checked. See ADR-011.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate installed blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate blueprint
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          fail() {
            echo "FAIL: $1"
            failed=1
          }

          # The structural floor every consumer needs.
          for d in blueprint templates standards; do
            test -d "$d" || fail "missing directory: $d"
          done

          # Every process phase has to declare its information items, or the
          # blueprint is not the blueprint. Phase 00 states principles and is
          # excluded; see standards/information-items.md.
          for i in $(seq -w 0 14); do
            compgen -G "blueprint/${i}-*.md" > /dev/null \
              || fail "missing phase document: blueprint/${i}-*.md"
          done
          for i in $(seq -w 1 14); do
            for doc in blueprint/${i}-*.md; do
              [ -f "$doc" ] || { fail "missing phase document: blueprint/${i}-*.md"; continue; }
              grep -qx '## Information items' "$doc" \
                || fail "phase does not declare '## Information items': ${doc}"
              for sub in '### Inputs' '### Outputs'; do
                grep -qx "$sub" "$doc" || fail "phase missing '${sub}': ${doc}"
              done
            done
          done

          # A consumer that has modified its copy should be able to see that,
          # and a consumer that has not should be told which version it has.
          if [ -f .blueprint-install.json ]; then
            if ! grep -q '"version"' .blueprint-install.json; then
              fail "adoption manifest does not record a version: .blueprint-install.json"
            fi
            echo "Installed blueprint version:"
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/  \1/p' \
              .blueprint-install.json
          else
            echo "NOTE: no .blueprint-install.json; this copy was not installed with the shipped installer."
          fi

          if [ "$failed" -eq 1 ]; then
            echo "Blueprint validation FAILED"
            exit 1
          fi
          echo "Blueprint validation OK"
