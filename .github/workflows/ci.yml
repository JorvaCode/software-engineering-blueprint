name: Blueprint CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint markdown
        # Pinned exactly. A floating tag here would let a new release change the
        # gate without a change in this repository. See ADR-007.
        run: npx --yes markdownlint-cli@0.49.1 "**/*.md"

  blueprint-validation:
    name: Validate blueprint structure and content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate blueprint
        # The validation lives in a script, not inline here. It is also run by
        # .github/workflows/reusable-blueprint-validation.yml, and a gate copied
        # into two workflows is a gate that will eventually disagree with itself.
        # See ADR-011.
        run: bash scripts/validate-blueprint.sh

  installer-tests:
    name: Test the installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test installers
        # Executes both installers against a real temporary destination. An
        # installer that is never run is not tested, and reading one does not
        # reveal that its output cannot be captured. See ADR-011.
        # ubuntu-latest ships pwsh, so the PowerShell path is covered here too.
        run: bash scripts/test-installers.sh
