# The gate runs two third-party things: actions/checkout and markdownlint-cli.
# Both are pinned, which is exactly why a pin goes stale silently. Dependabot
# proposes the bump; it does not apply it, and nothing here auto-merges.
#
# Only the GitHub Actions ecosystem is configured. Dependabot's npm integration
# reads package.json and a lockfile, and this repository deliberately has
# neither: markdownlint-cli is invoked as `npx markdownlint-cli@0.49.1` precisely
# so that running the gate needs no Node toolchain checked out. An npm entry here
# would open no pull requests ever, which is a check that looks present and is
# not. The markdownlint pin is therefore reviewed by hand at release time, and
# that gap is declared rather than papered over.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A major bump of the checkout action can change what the gate does, so
    # these are proposals to review and not notifications to dismiss.
    open-pull-requests-limit: 5
